spring.application.name=CheWallet

spring.datasource.url=jdbc:mysql://localhost:3306/db_chewallet
spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}
jwt.expirationTime=86400000
mercadopago.access.token=${TOKEN_MP}

server.address=0.0.0.0
server.port=8083


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notificaciones.general.web@gmail.com
spring.mail.password=${SPRING_CLAVE_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
